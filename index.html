<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + env(safe-area-inset-*) no CSS: sem isso a barra de
     abas fica embaixo do indicador de início do iPhone. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<!--
  Política de segurança de conteúdo.

  O GitHub Pages não deixa configurar cabeçalhos HTTP, então ela vai pela
  própria página. Vale menos que o cabeçalho de verdade (um atacante que já
  consiga alterar o HTML também apaga isto), mas cobre o caso que importa
  aqui: o app exibe texto e links vindos de uma IA e de buscas na web. Se
  algum dia um desses conteúdos conseguir virar `<script>`, esta linha é o
  que impede o script de rodar e de mandar os dados para fora.

  `connect-src` lista só os destinos que o app realmente chama: o Supabase,
  o Worker do assistente e a agenda do Google. Qualquer tentativa de enviar
  dados para outro endereço é bloqueada pelo navegador.

  `frame-ancestors` ficaria bem aqui — impediria o app de ser embutido num
  iframe de outro site — mas o navegador a ignora quando vem por <meta>, e
  só reclama no console. Para tê-la seria preciso um servidor que define
  cabeçalhos, que o GitHub Pages não oferece.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://accounts.google.com;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: https:;
  font-src 'self';
  connect-src 'self' https://jkzsucknezplwedrigjo.supabase.co https://norte-assistente.duo-marketing.workers.dev https://www.googleapis.com https://accounts.google.com;
  frame-src https://accounts.google.com;
  form-action 'none';
  base-uri 'self';
  object-src 'none'">

<!-- Não vazar o endereço do app para sites de terceiros ao clicar num link. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light dark">
<title>Norte</title>

<!-- Faz o ícone da tela de início abrir em tela cheia, sem barra do Safari. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Norte">
<meta name="theme-color" content="#2563EB">

<link rel="manifest" href="manifest.webmanifest">

<!--
  Ícone da tela de início (iOS).
  Três detalhes que decidem se o ícone aparece ou se vem um quadrado em branco:
  · PNG **sem canal alfa** — o iOS compõe transparência como preto e, em
    algumas versões, simplesmente ignora o ícone;
  · um `sizes` para cada tamanho que o iOS procura, em vez de um só genérico;
  · `-precomposed` como rede de segurança para versões antigas.
  O iOS guarda o ícone no momento em que você adiciona à tela: trocar o
  arquivo não atualiza um ícone já criado — é preciso apagar e adicionar de novo.
-->
<link rel="apple-touch-icon" sizes="180x180" href="icons/norte-180-v3.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/norte-167-v3.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/norte-152-v3.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/norte-120-v3.png">
<link rel="apple-touch-icon-precomposed" href="icons/norte-180-v3.png">

<!--
  favicon.ico multi-tamanho (16 a 256): é o que o Windows usa no atalho da
  área de trabalho e o que navegadores antigos procuram antes do PNG.
-->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icons/norte-192-v3.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/norte-32-v3.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <h1 id="screen-title">Início</h1>
  <div class="topbar-actions">
    <button id="btn-chat" class="icon-btn accent" aria-label="Abrir assistente">✦</button>
    <button id="btn-settings" class="icon-btn" aria-label="Configurações">⚙</button>
  </div>
</header>

<main id="screen" tabindex="-1"></main>

<nav class="tabbar" role="tablist" aria-label="Seções">
  <button class="tab" data-route="inicio" role="tab" aria-selected="true">
    <span class="tab-icon">⌂</span><span class="tab-label">Início</span>
  </button>
  <button class="tab" data-route="financeiro" role="tab" aria-selected="false">
    <span class="tab-icon">≡</span><span class="tab-label">Financeiro</span>
  </button>
  <button class="tab" data-route="metas" role="tab" aria-selected="false">
    <span class="tab-icon">◎</span><span class="tab-label">Metas</span>
  </button>
  <button class="tab" data-route="diario" role="tab" aria-selected="false">
    <span class="tab-icon">▤</span><span class="tab-label">Diário</span>
  </button>
  <button class="tab" data-route="calendario" role="tab" aria-selected="false">
    <span class="tab-icon">▦</span><span class="tab-label">Calendário</span>
  </button>
</nav>

<!-- Folha modal reutilizada por todos os formulários. -->
<div id="sheet-backdrop" class="sheet-backdrop" hidden>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet-head">
      <button id="sheet-cancel" class="link-btn">Cancelar</button>
      <h2 id="sheet-title">Título</h2>
      <button id="sheet-confirm" class="link-btn strong">Salvar</button>
    </header>
    <div id="sheet-body" class="sheet-body"></div>
  </section>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
